<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#161917"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>拾姿 · PoseFrame</title><link rel="stylesheet" href="style.css?v=1021"></head><body><div id="app"><main id="pfBoot" style="max-width:34rem;margin:12vh auto;padding:24px;color:#e7ebe4;background:#202720;border-radius:18px;font:16px/1.6 system-ui,sans-serif"><h1 style="color:#BCCCAF">拾姿 · PoseFrame</h1><p id="pfBootStatus" role="status">正在加载程序及本地图库…</p><pre id="pfBootError" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><button type="button" onclick="location.reload()">重新加载</button><p style="font-size:13px">V1.0.2-r1 · 大模型导入修复 · 此操作不会清除图库。</p><noscript>请在浏览器设置中启用 JavaScript。</noscript></main></div><input id="files" type="file" accept="image/*" multiple hidden><input id="restore" type="file" multiple accept="*/*" hidden><div id="toast" role="status" aria-live="polite"></div><input id="modelpack" type="file" accept="*/*" hidden><script>(function(){
function show(message){var panel=document.getElementById('pfBoot');if(!panel)return;document.getElementById('pfBootStatus').textContent='启动未完成';var detail=document.getElementById('pfBootError');detail.textContent+=(detail.textContent?'\n':'')+message;}
window.addEventListener('error',function(e){if(e.target&&e.target.tagName==='SCRIPT'){show('脚本加载失败：'+e.target.getAttribute('src'));}else if(e.message){show(e.message+' '+(e.filename||'')+':'+(e.lineno||0));}},true);
window.addEventListener('unhandledrejection',function(e){show(String(e.reason&&e.reason.message||e.reason));});
setTimeout(function(){var panel=document.getElementById('pfBoot');if(panel&&!document.getElementById('pfBootError').textContent)show('等待本地图库或程序加载超过30秒。请保持联网并重新加载；不要清除网站数据。');},30000);
})();</script><script src="pro-core.js?v=1021"></script><script src="ai-core.js?v=1021"></script><script src="ai-ui.js?v=1021"></script><script src="longterm-core.js?v=1021"></script><script src="longterm.js?v=1021"></script><script src="pro-ui.js?v=1021"></script><script src="app.js?v=1021"></script></body></html>
